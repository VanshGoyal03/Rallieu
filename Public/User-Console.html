<!DOCTYPE html>
<html lang="en" ng-app="kuchModule">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Admin Console</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        var mymodule = angular.module("kuchModule", []);

        mymodule.controller("kuchController", function ($scope, $http) {
            $scope.jsonArray = [];

            $scope.doFetchAll = function () {
                $http.get("/fetch-all-sports").then(function (response) {
                    $scope.jsonArray = response.data;
                }, function (err) {
                    alert("Error: " + JSON.stringify(err));
                });
            };


            $scope.doBlock = function (emailid) {
                $http.get("/Block-one?emailidKuch=" + emailid).then(function (response) {
                    alert(response.data);
                    $scope.doFetchAll();
                }, function (err) {
                    alert(JSON.stringify(err.data));
                });
            };

            $scope.doUnBlock = function (emailid) {
                $http.get("/UnBlock-one?emailidKuch=" + emailid).then(function (response) {
                    alert(response.data);
                    $scope.doFetchAll();
                }, function (err) {
                    alert(JSON.stringify(err.data));
                });
            };
        });
    </script>
    <style>
        #logo {
            border: 1px black solid;

            float: left;
            margin-top: px;

            background-size: contain;
            margin-left: 10px;
            margin-right: 10px;
            border-radius: 20%;
        }
    </style>
</head>

<body ng-controller="kuchController" ng-init="doFetchAll()">
    <nav class="navbar bg-primary" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" style="color:black; font-size: 23; font-weight: bolder;">
                <img src="pics/WhatsApp Image 2025-09-15 at 4.01.25 PM.jpeg" alt="Logo" width="48" height="32"
                    class="d-inline-block align-text-top" id="logo">
                RALLIEU
            </a>
        </div>
    </nav>
    <div class="container mt-3">
        <h3 class="text-center">User Admin Console</h3>
    </div>

    <div class="container mt-4">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Sr. No</th>
                    <th>EmailId</th>
                    <th>User Type</th>
                    <th>Status</th>
                    <th>Operations</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="obj in jsonArray">
                    <td>{{$index+1}}</td>
                    <td>{{obj.emailid}}</td>
                    <td>{{obj.usertype}}</td>
                    <td>{{obj.status}}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" ng-click="doBlock(obj.emailid)">Block</button>
                        <button class="btn btn-success btn-sm" ng-click="doUnBlock(obj.emailid)">UnBlock</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <nav class="navbar bg-body-primary bg-primary mt-5" style="transform: translateY(400px);">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">&copy;2025 RALLIEU. All Rights Reserved.</span>
            </div>
        </nav>
</body>

</html>

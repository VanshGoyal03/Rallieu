    <script>
        function showPrev1(fileRef, prevRef) {
            const [file] = fileRef.files
            if (file) {
                prevRef.src = URL.createObjectURL(file)
            }
        }
        function showPrev2(fileRef, prevRef) {
            const [file] = fileRef.files
            if (file) {
                prevRef.src = URL.createObjectURL(file)
            }
        }

        $(document).ready(function () {
            $("#btnFetchWithAJAX").click(function () {

                let obj = {
                    type: "get",
                    url: "/get-player",
                    data: {
                        txtEmail5: $("#txtEmail5").val()
                        //txtPwd:$("#txtPwd").val()
                    }
                }


                $.ajax(obj).then(
                    function (responseJsonAry) {

                        let data;//gpt for undefined error 

                        if (Array.isArray(responseJsonAry) && responseJsonAry.length > 0) {
                            data = responseJsonAry[0];
                        } else if (responseJsonAry && typeof responseJsonAry === 'object') {
                            data = responseJsonAry;
                        } else {
                            alert("No data found.");
                            return;
                        } //end



                        alert(JSON.stringify(responseJsonAry))
                        let address = responseJsonAry[0].address;
                        let city = responseJsonAry[0].city;
                        let state = responseJsonAry[0].state;
                        let zip = responseJsonAry[0].zip;
                        let sports = responseJsonAry[0].sports;
                        let number = responseJsonAry[0].number;
                        let picurl1 = responseJsonAry[0].picurl1;
                        let picurl2 = responseJsonAry[0].picurl2;
                        let about = responseJsonAry[0].about;

                        // alert(orgname + "\n"  + picurl);
                        $("#txtAdd1").val(address);
                        $("#txtCity").val(city);
                        $("#txtState").val(state);
                        $("#txtZip").val(zip);
                        $("#txtSports").val(sports);
                        $("#txtNo").val(number);
                        $("#prev1").prop("src", picurl1);
                        $("#hdn1").val(picurl1);
                        $("#prev2").prop("src", picurl2);
                        $("#hdn2").val(picurl2);
                        $("#txtAorg").val(about);

                    }).fail(function (err) { alert(err.message) })
            })
        })

    </script>

        <div class="col-md-8 offset-md-2">

                <div class="col-md-4">

                <div class="col-md-2">

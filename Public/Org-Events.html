<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous">
        </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () { //doubt 
            $("#btnevents").click(function () {

                let obj = {
                    type: "get",
                    url: "/org-events",
                    data: {
                        txtEmail4: $("#txtEmail4").val(),
                        txtEvent: $("#txtEvent").val(),
                        txtDate: $("#txtDate").val(),
                        txtTime: $("#txtTime").val(),
                        txtAdd1: $("#txtAdd1").val(),
                        txtCity: $("#txtCity").val(),
                        txtSports: $("#txtSports").val(),
                        txtMin: $("#txtMin").val(),
                        txtMax: $("#txtMax").val(),
                        txtReg: $("#txtReg").val(),
                        txtFee: $("#txtFee").val(),
                        txtPrice: $("#txtPrice").val(),
                        txtPer: $("#txtPer").val(),
                        txtDet: $("#txtDet").val(),
                        txtGuest: $("#txtGuest").val(),


                    }
                }


                $.ajax(obj).then(
                    function (responseJsonAry) {

                        alert(JSON.stringify(responseJsonAry))

                    }).fail(function (err) { alert(err.message) })
            })
        })

    </script>
    <style>
         #logo {
            border: 1px black solid;

            float: left;
            margin-top: px;

            background-size: contain;
            margin-left: 10px;
            margin-right: 10px;
            border-radius: 20%;
        }
    </style>
</head>

<body>
    <nav class="navbar bg-primary"  data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand"  style="color:black; font-size: 23; font-weight: bolder;" >
                <img src="pics/WhatsApp Image 2025-09-15 at 4.01.25 PM.jpeg" alt="Logo" width="48" height="32"
                    class="d-inline-block align-text-top" id="logo">
                RALLIEU
            </a>
        </div>
    </nav>
    <div class="container mt-4">

        <div class="row ">
            <div class="col-md-8 offset-md-2 bg-danger text-white" style="margin-bottom: 20px;">
                <center>
                    <h2>Post A Event </h2>
                </center>
            </div>
        </div>
        <div class="col-md-8 offset-md-2" style="margin-bottom: 50px;">
            <form class="row g-3" enctype="multipart/form-data">
                <div class="col-md-12">
                    <label for="txtEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="txtEmail4" name="txtEmail4">
                </div>
                <div class="col-md-6">
                    <label for="txtEvent" class="form-label">Event Name</label>
                    <input type="text" class="form-control" id="txtEvent" name="txtEvent">
                </div>
                <div class="col-md-3">
                    <label for="txtDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="txtDate" name="txtDate">
                </div>
                <div class="col-md-3">
                    <label for="txtTime" class="form-label">Time</label>
                    <input type="time" class="form-control" id="txtTime" name="txtTime">
                </div>
                <div class="col-md-8">
                    <label for="txtAdd1" class="form-label">Address</label>
                    <input type="text" class="form-control" id="txtAdd1" name="txtAdd1" placeholder="1234 Main St ">
                </div>
                <div class="col-md-4">
                    <label for="txtCity" class="form-label">City</label>
                    <input type="text" class="form-control" id="txtCity" name="txtCity">
                </div>
                <div class="dropdown col-md-6 ">
                    <label for="txtSports" class="form-label">Select Sport</label>
                    <select class="form-select" aria-label="Default select example" id="txtSports" name="txtSports">
                        <option selected disabled value="">Pick a Sport</option>`
                        <option value="Cricket">Cricket</option>
                        <option value="Football">Football</option>
                        <option value="Golf">Golf</option>
                        <option value="Koko">Koko</option>
                        <option value="Hockey">Hockey</option>
                        <option value="Dangal">Dangal</option>
                        <option value="Swimming">Swimming</option>
                        <option value="Basketball">Basketball</option>

                    </select>

                </div>
                <div class="col-md-3">
                    <label for="txtMin" class="form-label">Min. Age</label>
                    <input type="number" class="form-control" id="txtMin" name="txtMin">
                </div>
                <div class="col-md-3">
                    <label for="txtMax" class="form-label">Max. Age</label>
                    <input type="number" class="form-control" id="txtMax" name="txtMax">
                </div>
                <div class="col-md-6">
                    <label for="txtReg" class="form-label">Last Date of Registration</label>
                    <input type="date" class="form-control" id="txtReg" name="txtReg">
                </div>
                <div class="col-md-3">
                    <label for="txtFee" class="form-label">Fee</label>
                    <input type="number" class="form-control" id="txtFee" name="txtFee">
                </div>
                <div class="col-md-3">
                    <label for="txtPrice" class="form-label">Price Money</label>
                    <input type="number" class="form-control" id="txtPrice" name="txtPrice">
                </div>
                <div class="col-md-6">
                    <label for="txtPer" class="form-label">Person Incharge</label>
                    <input type="text" class="form-control" id="txtPer" name="txtPer">
                </div>
                <div class="col-md-6">
                    <label for="txtDet" class="form-label">Contact Details</label>
                    <input type="text" class="form-control" id="txtDet" name="txtDet">
                </div>
                <div class="col-md-3">

                </div>
                <div class="col-md-6">
                    <label for="txtGuest" class="form-label">Guest of Honor</label>
                    <input type="text" class="form-control" id="txtGuest" name="txtGuest">
                </div>
                <div class="col-md-3">

                </div>
                <div class="col-12" style="margin-top: 25px;">
                    <center>
                        <button type="button" class="btn btn-info" id="btnevents">Send To Server</button>
                    </center>
                </div>
            </form>
        </div>
    </div>
    <nav class="navbar bg-body-primary bg-primary mt-5" style="transform: translateY(30px);">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">&copy;2025 RALLIEU. All Rights Reserved.</span>
        </div>
    </nav>
</body>

</html>

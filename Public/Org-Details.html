    <script>
        function showPrev(fileRef, prevRef) {
            const [file] = fileRef.files
            if (file) {
                prevRef.src = URL.createObjectURL(file)
            }
        }

    </script>
    <script>
        $(document).ready(function () {
            $("#btnFetchWithAJAX").click(function () {

                let obj = {
                    type: "get",
                    url: "/get-one",
                    data: {
                        txtEmail3: $("#txtEmail3").val()
                        //txtPwd:$("#txtPwd").val()
                    }
                }


                $.ajax(obj).then(
                    function (responseJsonAry) {

                        let data;//gpt for undefined error 

                        if (Array.isArray(responseJsonAry) && responseJsonAry.length > 0) {
                            data = responseJsonAry[0];
                        } else if (responseJsonAry && typeof responseJsonAry === 'object') {
                            data = responseJsonAry;
                        } else {
                            alert("No data found.");
                            return;
                        } //end



                        alert(JSON.stringify(responseJsonAry))
                        let orgname = responseJsonAry[0].orgname;
                        let regnum = responseJsonAry[0].regnum;
                        let add1 = responseJsonAry[0].add1;
                        let add2 = responseJsonAry[0].add2;
                        let city = responseJsonAry[0].city;
                        let state = responseJsonAry[0].state;
                        let zip = responseJsonAry[0].zip;
                        let sports = responseJsonAry[0].sports;
                        let website = responseJsonAry[0].website;
                        let iandf = responseJsonAry[0].iandf;
                        let orghead = responseJsonAry[0].orghead;
                        let orghno = responseJsonAry[0].orghno;
                        let picurl = responseJsonAry[0].picurl;
                        let about = responseJsonAry[0].about;

                        // alert(orgname + "\n"  + picurl);
                        $("#txtOname").val(orgname);
                        $("#txtRNo").val(regnum);
                        $("#txtAdd1").val(add1);
                        $("#txtAdd2").val(add2);
                        $("#txtCity").val(city);
                        $("#txtState").val(state);
                        $("#txtZip").val(zip);
                        $("#txtSports").val(sports);
                        $("#txtWeb").val(website);
                        $("#txtIF").val(iandf);
                        $("#txtOhead").val(orghead);
                        $("#txtHNo").val(orghno);
                        $("#txtAorg").val(about);
                        $("#prev").prop("src", picurl);
                        $("#hdn").val(picurl);

                    }).fail(function (err) { alert(err.message) })
            })
        })
    </script>

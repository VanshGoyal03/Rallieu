<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous">
        </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            // alert("Run")
            $("#sbtn").click(function () {
                // alert();
                let obj = {
                    type: "get",
                    url: "/server-signup",
                    data: {
                        txtEmail: $("#txtEmail").val(),
                        txtPwd: $("#txtPwd").val(),
                        txtUser: $("#txtUser").val(),

                    }
                }

                $.ajax(obj).then(
                    function (responseJsonAry) {
                        alert(JSON.stringify(responseJsonAry))


                    }).fail(function (err) { alert(err.message) })
            })

            $("#lbtn").click(function () {
                // alert();
                let obj = {
                    type: "get",
                    url: "/server-login",
                    data: {
                        txtEmail2: $("#txtEmail2").val(),
                        txtPwd2: $("#txtPwd2").val(),

                    }
                }

                $.ajax(obj).then(
                    function (response) {
                         //alert("*"+ response + "*")
                        if (response == " Blocked")
                            alert("Sorry! Your Id is Blocked")

                        else if (response == " Invalid credentials ")
                            alert("Invalid Email or Password")

                        else

                            if (response == "Player") {
                                localStorage.setItem("activeUser", txtEmail2);

                                location.href = "Dash-Player.html";
                            }


                            else if (response == "Organization") {
                                localStorage.setItem("activeUser", txtEmail2)

                                location.href = "Dash-Organizer.html ";
                            }
                            else if (response == "Admin") {
                                localStorage.setItem("activeUser", txtEmail2)

                                location.href = "Dash-Admin.html "
                            }
                    }).fail(function (err) { alert(err.message) })
            })
        })
    </script>
    <style>
        .btn wrapper {
            padding-right: 10px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div style="display: flex; justify-content: center;">
        <div class="btn wrapper">
            <button type="button" class="btn btn-danger" data-bs-toggle="modal"
                data-bs-target="#divSignup">Signup</button>
            <button type="button" class="btn btn-success" data-bs-toggle="modal"
                data-bs-target="#divLogin">Login</button>
            <a href="Dash-Organizer.html" class="btn btn-warning">Organization Dashboard</a>
            <a href="Dash-Player.html" class="btn btn-primary">Player Dashboard</a>
            <a href="Dash-Admin.html" class="btn btn-secondary">Admin Portal</a>
        </div>
    </div>


    <!-- MODAL signup -->
    <div class="modal fade" tabindex="-1" id="divSignup">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Signup</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <form enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="txtEmail" name="txtEmail"
                                aria-describedby="emailHelp"> <!--id for script and jquery and name for server -->
                            <div id="emailHelp" class="form-text">We'll never share your email with anyone else.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <input type="password" class="form-control" id="txtPwd" name="txtPwd">
                        </div>

                        <div class="dropdown" style="margin-bottom: 20px;">

                            <select class="form-select" aria-label="Default select example" id="txtUser" name="txtUser">
                                <option selected disabled value="">Select User Type</option>
                                <option value="Organization">Organization</option>
                                <option value="Player">Player</option>

                            </select>

                        </div>
                        <center>
                            <button type="button" id="sbtn" class="btn btn-primary">Signup</button>
                            <!-- type="button" bcz of AJAX call -->
                        </center>
                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- MODAL login -->
    <div class="modal fade" tabindex="-1" id="divLogin">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <form enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="txtEmail2" name="txtEmail2"
                                aria-describedby="emailHelp">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Password</label>
                            <input type="password" class="form-control" id="txtPwd2" name="txtPwd2">
                        </div>

                        <center>
                            <button type="button" class="btn btn-primary" id="lbtn">Login</button>
                        </center>
                    </form>

                </div>

            </div>
        </div>
    </div>


</body>

</html>
